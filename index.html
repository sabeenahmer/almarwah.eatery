<style>

/* =========================================================
   GLOBAL RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Open Sans', sans-serif;
    color: #333333;
    background: #ffffff;
    line-height: 1.6;
    overflow-x: hidden;
}

:root {
    --primary-red: #c41e3a;
    --dark-red: #8b0000;
    --white: #ffffff;
    --light-gray: #f8f8f8;
    --medium-gray: #ededed;
    --dark-gray: #333333;
    --text-gray: #666666;
}


/* =========================================================
   HEADER
   ========================================================= */

header {
    width: 100%;
    background: linear-gradient(
        135deg,
        var(--primary-red) 0%,
        var(--dark-red) 100%
    );

    color: var(--white);

    padding: 10px 0;

    position: sticky;
    top: 0;
    z-index: 1000;

    box-shadow: 0 2px 10px rgba(196, 30, 58, 0.2);
}

.header-container {
    width: 100%;
    max-width: 1200px;

    margin: 0 auto;
    padding: 0 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    flex-direction: row-reverse;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;

    width: auto;
}

.logo img {
    display: block;

    width: auto;
    height: 50px;

    object-fit: contain;
}

nav {
    display: flex;
    align-items: center;
    gap: 25px;
}

nav a {
    color: var(--white);
    text-decoration: none;

    font-size: 15px;
    font-weight: 500;

    transition: opacity 0.2s ease;
}

nav a:hover {
    opacity: 0.8;
}

.whatsapp-nav {
    background: #25D366;

    color: #ffffff !important;

    padding: 7px 10px;

    border-radius: 7px;

    display: inline-flex;
    align-items: center;

    text-decoration: none;

    font-size: 14px !important;
    font-weight: 500 !important;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.whatsapp-nav:hover {
    background: #1ebe5d;
    transform: translateY(-1px);
    opacity: 1;
}


/* =========================================================
   HERO BANNER
   ========================================================= */

.hero {
    width: 100%;

    margin: 0 !important;
    padding: 0 !important;

    height: auto !important;
    min-height: 0 !important;

    line-height: 0;

    overflow: hidden;

    background: #ffffff;
}

.hero img {
    display: block;

    width: 100%;
    height: auto;

    margin: 0 !important;
    padding: 0 !important;

    border: 0;

    object-fit: contain;
}


/* =========================================================
   BRAND HERO
   ========================================================= */

.brand-hero {
    width: 100%;

    background: #ededed;

    padding: 55px 20px;

    text-align: center;

    margin: 0;
}

.brand-hero-content {
    width: 100%;
    max-width: 850px;

    margin: 0 auto;
}

.brand-hero h2 {
    margin: 0 0 14px;

    font-family: 'Poppins', sans-serif;

    color: #222222;

    font-size: clamp(28px, 3.5vw, 42px);
    font-weight: 700;

    line-height: 1.2;

    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.12);
}

.brand-hero p {
    margin: 0 auto;

    max-width: 850px;

    color: #666666;

    font-size: clamp(14px, 1.4vw, 17px);

    line-height: 1.75;
}


/* =========================================================
   WE ARE OFFERING
   ========================================================= */

.offers-section {
    width: 100%;

    background: #ffffff;

    padding: 75px 20px 85px;

    margin: 0;
}

.offers-container {
    width: 100%;
    max-width: 1150px;

    margin: 0 auto;
}


/* ---------- OFFERS INTRO ---------- */

.offers-heading {
    width: 100%;
    max-width: 800px;

    margin: 0 auto 50px;

    text-align: center;
}

.offers-heading span {
    display: block;

    margin-bottom: 8px;

    color: var(--primary-red);

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.offers-heading h2 {
    margin: 0 0 15px;

    color: #222222;

    font-family: 'Poppins', sans-serif;

    font-size: clamp(30px, 4vw, 42px);

    font-weight: 700;

    line-height: 1.2;
}

.offers-heading p {
    max-width: 750px;

    margin: 0 auto;

    color: #666666;

    font-size: 16px;

    line-height: 1.7;
}


/* ---------- OFFERS GRID ---------- */

.offers-grid {
    width: 100%;

    display: grid;

    grid-template-columns: repeat(3, minmax(0, 1fr));

    gap: 28px;

    align-items: stretch;
}


/* ---------- OFFER CARD ---------- */

.offer-card {
    width: 100%;
    min-width: 0;

    display: flex;
    flex-direction: column;

    background: #ffffff;

    border: 1px solid #e6e6e6;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.07);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.offer-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.12);
}


/* ---------- OFFER IMAGE ---------- */

.offer-image {
    width: 100%;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    background: #f2f2f2;
}

.offer-image img {
    display: block;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    object-fit: cover;

    transition: transform 0.35s ease;
}

.offer-card:hover .offer-image img {
    transform: scale(1.04);
}


/* ---------- OFFER CONTENT ---------- */

.offer-content {
    flex: 1;

    display: flex;
    flex-direction: column;

    padding: 24px;
}

.offer-content h3 {
    margin: 0 0 12px;

    color: var(--primary-red);

    font-family: 'Poppins', sans-serif;

    font-size: 21px;
    font-weight: 700;

    line-height: 1.3;
}

.offer-content p {
    margin: 0 0 20px;

    color: #555555;

    font-size: 15px;

    line-height: 1.7;
}

.offer-link {
    display: inline-block;

    width: fit-content;

    margin-top: auto;

    color: var(--primary-red);

    font-size: 14px;
    font-weight: 700;

    text-decoration: none;

    transition: color 0.2s ease;
}

.offer-link:hover {
    color: var(--dark-red);
}


/* =========================================================
   MENU SECTION
   ========================================================= */

.container {
    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    padding: 0 20px;
}

.section {
    width: 100%;

    padding: 60px 20px;
}

.section-title {
    margin: 0 0 50px;

    font-family: 'Poppins', sans-serif;

    font-size: 36px;
    font-weight: 700;

    line-height: 1.2;

    text-align: center;

    color: var(--primary-red);
}

.category-section {
    margin-bottom: 50px;
}

.category-title {
    display: inline-block;

    margin: 0 0 30px;

    padding-bottom: 12px;

    border-bottom: 3px solid var(--primary-red);

    font-family: 'Poppins', sans-serif;

    font-size: 24px;
    font-weight: 700;

    color: var(--primary-red);
}


/* ---------- MENU GRID ---------- */

.menu-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 30px;

    margin-bottom: 40px;
}


/* ---------- MENU CARD ---------- */

.menu-item {
    width: 100%;

    background: #ffffff;

    border-radius: 12px;

    overflow: hidden;

    border: 1px solid #eeeeee;

    box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.08);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.menu-item:hover {
    transform: translateY(-5px);

    box-shadow:
        0 12px 30px rgba(196, 30, 58, 0.15);
}


/* ---------- MENU IMAGE ---------- */

.menu-item-image {
    display: block;

    width: 100%;
    height: 220px;

    object-fit: cover;

    background: var(--light-gray);
}


/* ---------- MENU CONTENT ---------- */

.menu-item-content {
    padding: 20px;
}

.menu-item-title {
    margin-bottom: 8px;

    font-family: 'Poppins', sans-serif;

    font-size: 18px;
    font-weight: 600;

    line-height: 1.3;

    color: var(--dark-gray);
}

.menu-item-description {
    margin-bottom: 15px;

    color: var(--text-gray);

    font-size: 14px;

    line-height: 1.5;
}

.menu-item-footer {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.quantity-badge {
    background: var(--light-gray);

    color: var(--text-gray);

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 11px;
    font-weight: 600;
}

.price {
    color: var(--primary-red);

    font-family: 'Poppins', sans-serif;

    font-size: 18px;
    font-weight: 700;
}


/* ---------- DUMMY ITEM ---------- */

.menu-item.dummy {
    background: transparent;

    border: none;

    box-shadow: none;
}

.menu-item.dummy:hover {
    transform: none;

    box-shadow: none;
}


/* =========================================================
   INFO BANNER
   ========================================================= */

.info-banner {
    width: 100%;

    margin: 40px 0;

    padding: 18px 20px;

    background: var(--primary-red);

    color: #ffffff;

    border-radius: 8px;

    text-align: center;

    font-size: 14px;
    font-weight: 500;
}

.info-banner strong {
    display: block;

    margin-bottom: 5px;
}


/* =========================================================
   CONTACT
   ========================================================= */

.contact-section {
    background: var(--light-gray);
}

.contact-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 20px;

    margin-top: 40px;
}

.contact-card {
    background: #ffffff;

    padding: 30px;

    border-radius: 12px;

    text-align: center;

    box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.08);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.contact-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 8px 25px rgba(196, 30, 58, 0.15);
}

.contact-icon {
    width: 60px;
    height: 60px;

    margin: 0 auto 10px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 28px;
}

.contact-icon i {
    font-size: 32px;

    color: #25D366;
}

.contact-card h3 {
    margin-bottom: 12px;

    font-family: 'Poppins', sans-serif;

    font-size: 20px;
    font-weight: 600;

    color: var(--dark-gray);
}

.contact-card p {
    margin-bottom: 15px;

    color: var(--text-gray);

    font-size: 14px;
}

.contact-link {
    color: var(--primary-red);

    font-size: 16px;
    font-weight: 600;

    text-decoration: none;

    transition: color 0.2s ease;
}

.contact-link:hover {
    color: var(--dark-red);
}


/* =========================================================
   FOOTER
   ========================================================= */

footer {
    width: 100%;

    margin-top: 0;

    padding: 30px 20px;

    background: #000000;

    color: #ffffff;

    text-align: center;
}

footer p {
    margin-bottom: 10px;

    font-size: 13px;
}

.footer-links {
    margin-top: 10px;
}

.footer-links a {
    margin: 0 10px;

    color: #ffffff;

    font-size: 13px;

    text-decoration: none;
}

.footer-links a:hover {
    color: var(--primary-red);
}


/* =========================================================
   TABLET
   901px - 1100px
   ========================================================= */

@media (max-width: 1100px) {

    .offers-container {
        max-width: 1000px;
    }

    .menu-grid {
        gap: 20px;
    }

}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

    .header-container {
        padding-left: 18px;
        padding-right: 18px;
    }

    .offers-section {
        padding: 60px 20px 70px;
    }

    .offers-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
    }

    .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
    }

    .contact-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

    /* ---------- HEADER ---------- */

    header {
        padding: 10px 0 0;
    }

    .header-container {
        width: 100%;

        padding: 10px 15px 0;

        flex-direction: column;

        gap: 0;
    }

    .logo {
        width: 100%;

        margin-bottom: 10px;
    }

    .logo img {
        width: auto;
        max-width: 100%;
        height: 48px;
    }

    nav {
        width: calc(100% + 30px);

        margin: 0 -15px;

        padding: 12px 15px;

        justify-content: center;

        gap: 18px;

        background: rgba(0, 0, 0, 0.18);
    }

    nav a {
        font-size: 13px;
    }

    .whatsapp-nav {
        padding: 6px 9px;

        font-size: 13px !important;
    }


    /* ---------- HERO ---------- */

    .hero {
        width: 100%;

        height: auto !important;

        margin: 0 !important;
        padding: 0 !important;

        line-height: 0;

        overflow: hidden;
    }

    .hero img {
        width: 100%;

        height: auto !important;

        display: block;

        margin: 0 !important;
        padding: 0 !important;
    }


    /* ---------- BRAND HERO ---------- */

    .brand-hero {
        padding: 38px 18px 42px;
    }

    .brand-hero h2 {
        font-size: 28px;
    }

    .brand-hero p {
        font-size: 14px;

        line-height: 1.7;
    }


    /* ---------- OFFERS ---------- */

    .offers-section {
        padding: 50px 16px 60px;
    }

    .offers-heading {
        margin-bottom: 32px;
    }

    .offers-heading span {
        font-size: 11px;

        letter-spacing: 1.5px;
    }

    .offers-heading h2 {
        font-size: 30px;

        margin-bottom: 12px;
    }

    .offers-heading p {
        font-size: 14px;

        line-height: 1.65;
    }

    .offers-grid {
        grid-template-columns: 1fr;

        gap: 22px;
    }

    .offer-card {
        border-radius: 12px;
    }

    .offer-content {
        padding: 20px;
    }

    .offer-content h3 {
        font-size: 20px;
    }

    .offer-content p {
        font-size: 14px;

        line-height: 1.65;
    }


    /* ---------- MENU ---------- */

    .section {
        padding: 45px 16px;
    }

    .container {
        padding: 0;
    }

    .section-title {
        font-size: 30px;

        margin-bottom: 35px;
    }

    .category-section {
        margin-bottom: 40px;
    }

    .category-title {
        font-size: 20px;

        margin-bottom: 22px;

        padding-bottom: 10px;
    }

    .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 14px;
    }

    .menu-item-image {
        height: auto;

        aspect-ratio: 1 / 1;

        object-fit: cover;
    }

    .menu-item-content {
        padding: 12px;
    }

    .menu-item-title {
        font-size: 14px;

        margin-bottom: 5px;
    }

    .menu-item-description {
        font-size: 11px;

        line-height: 1.4;

        margin-bottom: 9px;
    }

    .quantity-badge {
        padding: 4px 7px;

        font-size: 9px;
    }

    .price {
        font-size: 13px;
    }


    /* ---------- CONTACT ---------- */

    .contact-grid {
        grid-template-columns: 1fr;

        gap: 18px;

        margin-top: 25px;
    }

    .contact-card {
        padding: 25px 20px;
    }

    .contact-card h3 {
        font-size: 18px;
    }

    .contact-link {
        font-size: 15px;
    }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 480px) {

    .logo img {
        height: 44px;
    }

    nav {
        gap: 14px;
    }

    nav a {
        font-size: 12px;
    }

    .whatsapp-nav {
        font-size: 12px !important;

        padding: 6px 8px;
    }


    .brand-hero {
        padding: 32px 16px 36px;
    }

    .brand-hero h2 {
        font-size: 25px;

        margin-bottom: 12px;
    }

    .brand-hero p {
        font-size: 13px;

        line-height: 1.65;
    }


    .offers-section {
        padding: 42px 14px 50px;
    }

    .offers-heading h2 {
        font-size: 28px;
    }

    .offers-heading p {
        font-size: 13px;
    }


    .section-title {
        font-size: 27px;
    }

    .category-title {
        font-size: 18px;
    }

    .menu-grid {
        gap: 10px;
    }

    .menu-item-content {
        padding: 10px;
    }

    .menu-item-title {
        font-size: 12px;
    }

    .menu-item-description {
        font-size: 10px;
    }

    .price {
        font-size: 12px;
    }

    .quantity-badge {
        font-size: 8px;

        padding: 3px 6px;
    }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 360px) {

    nav {
        gap: 10px;
    }

    nav a {
        font-size: 11px;
    }

    .whatsapp-nav {
        font-size: 11px !important;
    }

    .menu-grid {
        gap: 8px;
    }

    .menu-item-content {
        padding: 8px;
    }

    .menu-item-title {
        font-size: 11px;
    }

    .menu-item-description {
        font-size: 9px;
    }

    .price {
        font-size: 11px;
    }

}

</style>
